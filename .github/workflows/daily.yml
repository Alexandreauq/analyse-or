name: Score quotidien Or

on:
  schedule:
    # Toutes les heures : recalcule le score et republie le site pour un
    # suivi quasi temps réel (utile surtout pour le cours de l'or et le
    # DXY, qui bougent en intraday — les facteurs FRED/CFTC ne changeront
    # de toute façon qu'au rythme de leur propre publication).
    # NB : un cron toutes les 15 min a été testé mais GitHub Actions ne le
    # respecte pas de façon fiable (observé : ~4h d'écart réel au lieu de
    # 15 min) — un cron horaire est beaucoup mieux honoré en pratique.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet Actions, pour tester

# Empêche deux exécutions qui se chevauchent de pousser en même temps sur main.
concurrency:
  group: score-quotidien
  cancel-in-progress: false

permissions:
  contents: write   # nécessaire pour que le workflow puisse commit/push les données mises à jour

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Déterminer si c'est le run quotidien (email + historique)
        id: daily_slot
        # Un seul des runs horaires de la journée compte comme "run
        # quotidien" (celui de 07h00 UTC = ~9h à Paris en heure d'été —
        # passer "07" à "08" fin octobre à l'heure d'hiver). Un
        # déclenchement manuel (workflow_dispatch) compte toujours comme
        # quotidien, pour pouvoir tester l'email facilement.
        run: |
          HOUR=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "07" ]; then
            echo "is_daily=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_daily=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculer le score et envoyer l'email
        run: python3 gold_score.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DAILY_SNAPSHOT: ${{ steps.daily_slot.outputs.is_daily }}

      - name: Publier les données mises à jour sur le site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/score.json score.json score_history.json dashboard.html
          git diff --staged --quiet || git commit -m "Mise à jour du score"
          git pull --rebase --autostash
          git push
