name: Score quotidien Or

on:
  schedule:
    # Toutes les heures : recalcule le score et republie le site pour un
    # suivi quasi temps réel (utile surtout pour le cours de l'or et le
    # DXY, qui bougent en intraday — les facteurs FRED/CFTC ne changeront
    # de toute façon qu'au rythme de leur propre publication).
    # NB : un cron toutes les 15 min a été testé mais GitHub Actions ne le
    # respecte pas de façon fiable (observé : ~4h d'écart réel au lieu de
    # 15 min) — un cron horaire est beaucoup mieux honoré en pratique.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet Actions, pour tester

# Empêche deux exécutions qui se chevauchent de pousser en même temps sur main.
concurrency:
  group: score-quotidien
  cancel-in-progress: false

permissions:
  contents: write   # nécessaire pour que le workflow puisse commit/push les données mises à jour

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Déterminer si c'est le run quotidien (email + historique)
        id: daily_slot
        # Un seul run par jour doit compter comme "run quotidien" (email +
        # entrée dans l'historique), visé autour de 07h00 UTC (~9h à Paris
        # en heure d'été). Le cron horaire dérive fortement en pratique
        # (écarts de plusieurs heures observés) : tester une heure exacte
        # ("$HOUR" = "07") fait rater le créneau, et donc toute la journée,
        # dès que le run de 07h ne tombe pas pile dedans — cause confirmée
        # de plusieurs jours sans entrée dans score_history.json. On
        # déclenche donc plutôt le run quotidien au premier passage horaire
        # à partir de 07h00 UTC qui constate qu'aucune entrée pour la date
        # du jour n'existe encore dans score_history.json — auto-réparateur
        # si le créneau exact (ou plusieurs runs) est raté. Un déclenchement
        # manuel (workflow_dispatch) compte toujours comme quotidien, pour
        # pouvoir tester l'email facilement (peut créer une entrée en plus
        # dans l'historique le même jour — comportement voulu pour tester).
        run: |
          HOUR_NUM=$((10#$(date -u +%H)))
          TODAY=$(date -u +%F)
          ALREADY_DONE=$(python3 -c "import json, os; f = 'score_history.json'; h = (json.load(open(f, encoding='utf-8')) if os.path.exists(f) else []); print('true' if any(e.get('date') == '$TODAY' for e in h) else 'false')" 2>/dev/null) || ALREADY_DONE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$HOUR_NUM" -ge 7 ] && [ "$ALREADY_DONE" = "false" ]; }; then
            echo "is_daily=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_daily=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculer le score et envoyer l'email
        run: python3 gold_score.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DAILY_SNAPSHOT: ${{ steps.daily_slot.outputs.is_daily }}

      - name: Calculer le score des autres commodités (argent, pétrole, gaz)
        # Chaque commodité est isolée par son propre "|| echo ::warning" :
        # aucune des 3 n'a jamais tourné contre les réseaux réels (CFTC,
        # FRED, yfinance), et ce shell tourne sous bash -e (défaut GitHub
        # Actions). Sans cette isolation, l'échec d'une seule commande fait
        # avorter tout le step (set -e) et donc tout le reste du job — y
        # compris le step "Publier" suivant, qui est celui qui pousse
        # réellement score.json/score_history.json DE L'OR. Résultat observé
        # si on laissait ça tel quel : score_history.json (or) ne reçoit
        # jamais l'entrée du jour, donc le run horaire suivant recalcule
        # is_daily=true à nouveau et renvoie l'email quotidien de l'or à
        # chaque heure tant qu'une commodité échoue. continue-on-error au
        # niveau du step ne suffirait pas : ça ne protège que le step
        # suivant, pas les lignes après la ligne qui a échoué DANS ce step
        # (set -e stopperait quand même avant petrole/gaz).
        run: |
          python3 commodity_score.py argent || echo "::warning::commodity_score.py argent a échoué — n'affecte pas le score or, voir les logs ci-dessus"
          python3 commodity_score.py petrole || echo "::warning::commodity_score.py petrole a échoué — n'affecte pas le score or, voir les logs ci-dessus"
          python3 commodity_score.py gaz || echo "::warning::commodity_score.py gaz a échoué — n'affecte pas le score or, voir les logs ci-dessus"
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DAILY_SNAPSHOT: ${{ steps.daily_slot.outputs.is_daily }}

      - name: Publier les données mises à jour sur le site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # N'ajoute que les fichiers qui existent réellement : un premier
          # run, ou un run où une commodité a échoué juste au-dessus (voir le
          # step précédent), ne produit pas ses fichiers score_<commodité>*.json
          # -- un `git add` qui lui est passé en dur ferait échouer `git add`
          # (fichier introuvable) et donc tout ce step sous bash -e, ce qui
          # bloquerait la publication du score or exactement comme le
          # problème que le step précédent corrige. Le `if` (pas un `[ -e ] &&`)
          # est volontaire : une condition de test dans un `if` ne déclenche
          # jamais `set -e` même si elle est fausse, alors qu'un `&&` en tête
          # de ligne le ferait.
          for f in docs/score.json score.json score_history.json dashboard.html \
                   docs/score_argent.json score_argent.json score_history_argent.json \
                   docs/score_petrole.json score_petrole.json score_history_petrole.json \
                   docs/score_gaz.json score_gaz.json score_history_gaz.json; do
            if [ -e "$f" ]; then
              git add "$f"
            fi
          done
          git diff --staged --quiet || git commit -m "Mise à jour du score"
          git pull --rebase --autostash
          git push
