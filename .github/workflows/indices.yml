name: Score fondamental Indices (CAC 40 pilote)

on:
  schedule:
    - cron: "0 6 * * *"   # une fois par jour, 06h00 UTC
  workflow_dispatch: {}

concurrency:
  group: score-indices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: DIAGNOSTIC TEMPORAIRE — test envoi email alerte entrée
        run: python3 indices_score.py --test-entry-email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

      - name: Publier les données mises à jour sur le site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/indices.json
          [ -f indices_history.json ] && git add indices_history.json || true
          git diff --staged --quiet || git commit -m "Mise à jour du score Indices"
          git pull --rebase --autostash
          git push
