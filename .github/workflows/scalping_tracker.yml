name: Suivi paper-trading Scalping Or

on:
  # GitHub ne respecte pas les cron plus fréquents que ~toutes les heures en
  # pratique (throttling documenté sur les schedules très courts) — ce cron
  # sert donc de filet de secours pour relancer une boucle si la précédente
  # s'arrête, pas de mécanisme principal. La cadence de 5 min vient de la
  # boucle interne du job ci-dessous, qui tourne en continu ~5h50.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: scalping-tracker
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lancer les tests
        run: node scalping_tracker.test.js

      - name: Boucle de suivi (toutes les 5 min pendant ~5h40)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          END=$((SECONDS + 340 * 60))
          while [ "$SECONDS" -lt "$END" ]; do
            # Se resynchroniser AVANT de générer de nouvelles données : si le
            # push précédent a échoué (rejet transitoire côté GitHub) ou si un
            # run concurrent a poussé entre-temps, ce pull --rebase absorbe
            # l'écart et retente naturellement la publication au push suivant,
            # au lieu de laisser un commit local bloqué indéfiniment.
            if ! git pull --rebase --autostash; then
              echo "::warning::git pull --rebase a échoué (probable conflit), abandon du rebase — on retentera au cycle suivant"
              git rebase --abort 2>/dev/null || true
            fi
            node scalping_tracker.js || echo "::warning::scalping_tracker.js a échoué pour ce cycle, on continue à la prochaine itération"
            if [ -f docs/scalping_tracking.json ]; then
              git add docs/scalping_tracking.json || true
              if ! git diff --staged --quiet; then
                git commit -m "Mise a jour du suivi Scalping" || echo "::warning::échec du commit local, on continue"
              fi
            fi
            # Toujours tenter le push (même sans nouveau diff ce cycle-ci) :
            # publie aussi tout commit resté en attente d'un push précédent
            # en échec. Une erreur ici (ex. rejet transitoire) ne doit JAMAIS
            # tuer la boucle de 5h40 — bash -e le ferait sans ce garde-fou.
            if ! git push; then
              echo "::warning::git push a échoué (probablement transitoire), retenté au cycle suivant via pull --rebase"
            fi
            sleep 300
          done
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
