<title>Recherche IA en verre, v2</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f1a;
    --text: #e8ecf2;
    --muted: #7a84a0;
    --blue: #2a5bff;
    --blue-soft: rgba(42, 91, 255, 0.4);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, sans-serif;
  }
  .home { position: relative; min-height: 100vh; width: 100%; box-sizing: border-box; overflow: hidden; }
  .wordmark {
    position: absolute; top: 40px; left: 0; right: 0; text-align: center;
    font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted);
  }

  /* Barre : centrée au repos, disparaît pendant la réflexion, revient en bas après la réponse */
  .search {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(920px, calc(100% - 32px));
    transition: transform 0.8s var(--ease), opacity 0.5s var(--ease);
  }
  .search input {
    width: 100%; height: 72px; border-radius: 36px; box-sizing: border-box;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: var(--text); font-size: 20px; padding: 0 28px; outline: none;
    transition: border-color 0.4s var(--ease), box-shadow 0.4s var(--ease), background 0.4s var(--ease);
  }
  .search input:focus {
    border-color: var(--blue-soft);
    box-shadow: 0 0 0 6px rgba(42,91,255,0.1), 0 0 60px rgba(42,91,255,0.2);
    background: rgba(255,255,255,0.06);
  }
  .search input::placeholder { color: var(--muted); }
  .thinking .search { opacity: 0; transform: translate(-50%, -220%); pointer-events: none; }
  .answered .search { top: auto; bottom: 40px; transform: translate(-50%, 0); }

  /* Zone centrale : orbe pendant la réflexion, réponse ensuite */
  .stage {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(920px, calc(100% - 32px));
    display: flex; flex-direction: column; align-items: center; gap: 24px;
    transition: top 0.8s var(--ease), transform 0.8s var(--ease);
  }
  .answered .stage { top: 42%; }

  .orb {
    position: relative; width: 150px; height: 150px; border-radius: 50%;
    transform: scale(0.2); opacity: 0;
    transition: transform 0.8s var(--ease), opacity 0.5s var(--ease);
    background: rgba(120, 160, 255, 0.10);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow:
      inset 0 0 40px rgba(42,91,255,0.55),
      inset 0 -14px 28px rgba(7,13,51,0.5),
      0 24px 50px rgba(0,0,0,0.5),
      0 0 60px rgba(42,91,255,0.35);
    animation: float 4s ease-in-out infinite;
  }
  .thinking .orb { transform: scale(1); opacity: 1; }
  .orb .light {
    position: absolute; left: 50%; top: 50%; width: 70px; height: 70px;
    margin: -35px 0 0 -35px; border-radius: 50%;
    background: radial-gradient(circle, #b8ccff, var(--blue) 55%, transparent 75%);
    filter: blur(8px);
    animation: breathe 2.6s ease-in-out infinite;
  }
  .orb .shine {
    position: absolute; top: 16px; left: 26px; width: 50px; height: 26px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.85), transparent 70%);
    transform: rotate(-28deg);
  }
  @keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -8px; } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { .orb, .orb .light { animation: none; } }

  .answer {
    width: 100%; opacity: 0; transform: translateY(12px);
    transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
  }
  .answer.shown { opacity: 1; transform: translateY(0); }
  .answer p { font-size: 17px; line-height: 1.7; color: #d6dcec; margin: 0 0 16px; text-align: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip {
    padding: 10px 16px; border-radius: 20px; font-size: 14px;
    background: rgba(42,91,255,0.12); border: 1px solid rgba(42,91,255,0.35);
    color: #9fb4ff; cursor: pointer;
    transition: transform 0.3s var(--ease), background 0.3s var(--ease);
  }
  .chip:hover { transform: translateY(-2px); background: rgba(42,91,255,0.2); }

  .demo {
    position: absolute; left: 50%; top: 24px; transform: translateX(-50%);
    font-size: 13px; color: var(--muted);
    background: none; border: 1px dashed rgba(255,255,255,0.15); border-radius: 10px;
    padding: 8px 14px; cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) { .orb, .orb .light { animation: none; } }
</style>

<div class="home" id="home">
  <div class="wordmark">AI Investment</div>

  <div class="search">
    <input id="q" type="search" placeholder="Demande-moi n'importe quoi sur tes données…">
  </div>

  <div class="stage">
    <div class="orb">
      <div class="light"></div>
      <div class="shine"></div>
    </div>
    <div class="answer" id="answer">
      <p id="answer-text"></p>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <button class="demo" id="demo">Simuler une réponse</button>
</div>

<script>
  const home = document.getElementById('home');
  const answer = document.getElementById('answer');
  const answerText = document.getElementById('answer-text');
  const chips = document.getElementById('chips');

  function simulate() {
    answer.classList.remove('shown');
    home.classList.remove('answered');
    home.classList.add('thinking');
    answerText.textContent = '';
    chips.innerHTML = '';
    setTimeout(() => {
      home.classList.remove('thinking');
      home.classList.add('answered');
      answerText.textContent = "Safran devance Airbus de 5,5 points de score brut. L'écart vient surtout de la rentabilité : le ROCE de Safran est de 55 % contre 24 % pour Airbus.";
      ['Voir Safran', 'Voir Airbus'].forEach(label => {
        const b = document.createElement('button');
        b.className = 'chip'; b.textContent = label; chips.appendChild(b);
      });
      answer.classList.add('shown');
    }, 2600);
  }

  document.getElementById('demo').addEventListener('click', simulate);
  document.getElementById('q').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.value.trim()) simulate();
  });
</script>
