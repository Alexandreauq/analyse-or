<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15161c">
<title>IA Investment</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');
  :root {
    --bg: #15161c; --panel: #1b1d25; --border: #2a2d38;
    --text: #edeef3; --muted: #8a90a3;
    --gold: #c6a15b; --rust: #b25539;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; min-height: 100%; overflow-x: hidden;
  }
  button { font: inherit; cursor: pointer; }
  a { text-decoration: none; }
  [hidden] { display: none !important; }

  .app { max-width: 720px; margin: 0 auto; }

  /* Les deux écrans occupent tout le viewport et se superposent pendant
     la transition ; #or glisse par-dessus #home puis repart au retour. */
  .home, #or {
    position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--bg);
  }
  #or {
    z-index: 2; transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(.4, 0, .2, 1);
  }
  #or.screen-in { transform: translateX(0); }
  #or.no-anim { transition: none; }

  /* Nav des modules (Or / Minières / Indices), fixe en haut à droite */
  .tabbar {
    position: fixed; top: 0; right: 0; z-index: 10;
    display: flex; gap: 6px;
    padding: max(14px, env(safe-area-inset-top)) 16px 12px max(12px, env(safe-area-inset-right));
  }
  .tab {
    font-size: 12px; padding: 6px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
  }
  .tab.active { color: var(--gold); border-color: var(--gold); }
  .tab.disabled { opacity: 0.35; pointer-events: none; }

  /* Écran d'accueil */
  .home {
    z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px; gap: 10px;
  }
  .home-wordmark { font-family: 'Fraunces', serif; font-weight: 500; font-size: 34px; letter-spacing: -0.01em; }
  .home-tagline { color: var(--muted); font-size: 13px; max-width: 280px; line-height: 1.5; margin: 0; }
  .home-hint { color: var(--muted); font-size: 12px; margin-top: 28px; }
  .home-hint .gold-word { color: var(--gold); }

  /* Écran d'un module (Or) */
  .screen main { padding: 0 20px 40px; }
  header { padding: 64px 20px 0; }
  .back-link { color: var(--muted); font-size: 12px; display: inline-block; margin-bottom: 10px; }
  .eyebrow { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px; margin: 0 0 4px; }
  .updated { color: var(--muted); font-size: 12px; margin: 0 0 16px; }

  .hero { display:flex; align-items:center; gap: 24px; padding: 12px 0 20px; }
  .hero-number { font-family: 'Fraunces', serif; font-weight: 500; font-size: 64px; line-height:1; color: var(--gold); }
  .hero-label { font-size: 16px; font-weight: 500; margin-bottom: 6px; }
  .hero-sub { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }

  .divider { height: 1px; background: var(--border); margin: 4px 0 20px; }
  h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 16px; margin: 0 0 12px; }

  .detail-btn {
    display: flex; align-items: center; gap: 6px; width: 100%;
    background: none; border: none; color: var(--gold);
    font-size: 13px; font-weight: 500; padding: 14px 0; margin-top: 4px;
    border-top: 1px solid var(--border);
  }
  .detail-btn .chevron { transition: transform 0.15s ease; }
  .detail-btn[aria-expanded="true"] .chevron { transform: rotate(180deg); }
  .detail-wrap { padding-top: 4px; }

  .factor-row { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .factor-head { display:flex; justify-content:space-between; margin-bottom: 6px; font-size: 13px; }
  .factor-name { font-weight: 500; }
  .factor-weight { color: var(--muted); }
  .bar-track { position:relative; height:6px; background: var(--border); border-radius: 3px; margin-bottom: 6px; }
  .bar-center { position:absolute; left:50%; top:-2px; bottom:-2px; width:1px; background: var(--muted); opacity:0.5; }
  .bar-fill { position:absolute; top:0; bottom:0; border-radius: 3px; }
  .factor-note { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 0; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin: 20px 0; }
  .tech-row { display:flex; justify-content:space-between; font-size:13px; padding: 5px 0; }
  .tech-label { color: var(--muted); }
  .tech-value { font-weight: 500; }

  .cal-row { display:flex; justify-content:space-between; gap:10px; font-size:12px;
             padding:8px 0; border-bottom:1px solid var(--border); }
  .cal-row:last-child { border-bottom: none; }
  .cal-left { display:flex; flex-direction:column; }
  .cal-date { color: var(--gold); font-size:12px; }
  .cal-kind { color: var(--muted); font-size:11px; white-space:nowrap; }

  .alert-row { border-left: 2px solid; padding: 4px 0 10px 12px; margin-bottom: 12px; }
  .alert-row:last-child { margin-bottom: 0; }
  .alert-head { display:flex; justify-content:space-between; font-size:13px; font-weight:500; gap:8px; }
  .alert-date { color: var(--muted); font-weight:400; white-space:nowrap; }
  .alert-detail { color: var(--muted); font-size:12px; line-height:1.5; margin:4px 0 0; }

  .empty { color: var(--muted); font-size: 13px; text-align:center; padding: 60px 20px; }
  .empty a { color: var(--gold); }
</style>
</head>
<body>

<nav class="tabbar">
  <button class="tab" data-route="or">Or</button>
  <button class="tab disabled" disabled>Minières</button>
  <button class="tab disabled" disabled>Indices</button>
</nav>

<div id="home" class="home">
  <div class="home-wordmark">IA Investment</div>
  <p class="home-tagline">Analyse macro-fondamentale automatisée, mise à jour en continu.</p>
  <p class="home-hint">Choisis un module — <span class="gold-word">Or</span> en haut à droite pour commencer.</p>
</div>

<div id="or" class="screen app" hidden>
  <header>
    <a href="#home" class="back-link">← IA Investment</a>
    <div class="eyebrow">Analyse — phase 1</div>
    <h1>Or</h1>
    <p class="updated" id="updated"></p>
  </header>

  <main id="content">
    <div class="empty">Chargement…</div>
  </main>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(() => {});
}

function alertColor(kind) {
  if (kind === 'risque') return 'var(--rust)';
  if (kind === 'watch' || kind === 'entree') return 'var(--gold)';
  return 'var(--muted)';
}

let scoreLoaded = false;

async function loadScore() {
  const content = document.getElementById('content');
  try {
    const res = await fetch('score.json?t=' + Date.now());
    if (!res.ok) throw new Error('score.json introuvable');
    const data = await res.json();
    render(data);
  } catch (e) {
    content.innerHTML = `<div class="empty">Données indisponibles pour l'instant.<br>${e.message}</div>`;
  }
}

function render(data) {
  document.getElementById('updated').textContent = 'Mis à jour le ' + data.date;

  const factorsHtml = data.factors.map(f => {
    const pct = Math.min(50, Math.abs(f.score) / 10 * 50);
    const positive = f.score >= 0;
    return `
      <div class="factor-row">
        <div class="factor-head">
          <span class="factor-name">${f.name}</span>
          <span class="factor-weight">${Math.round(f.weight * 100)}%</span>
        </div>
        <div class="bar-track">
          <div class="bar-center"></div>
          <div class="bar-fill" style="left:${positive ? 50 : 50 - pct}%; width:${pct}%; background:${positive ? 'var(--gold)' : 'var(--rust)'};"></div>
        </div>
        <p class="factor-note">${f.raw_value}</p>
      </div>`;
  }).join('');

  const t = data.technical || {};
  const spotStr = t.spot ? `${t.spot.toLocaleString('fr-FR', {maximumFractionDigits:0})} $ / oz` : 'indisponible';
  const ma200Str = t.ma200 ? `${t.ma200.toLocaleString('fr-FR', {maximumFractionDigits:0})} $ / oz` : 'indisponible';

  const calendarHtml = (data.calendar || []).map(c => `
    <div class="cal-row">
      <div class="cal-left">
        <span class="cal-date">${c.date}</span>
        <span>${c.label}</span>
      </div>
      <span class="cal-kind">${c.kind}</span>
    </div>`).join('');

  const alertsHtml = (data.alerts || []).map(a => `
    <div class="alert-row" style="border-left-color:${alertColor(a.kind)};">
      <div class="alert-head"><span>${a.title}</span><span class="alert-date">${a.date}</span></div>
      <p class="alert-detail">${a.detail}</p>
    </div>`).join('');

  document.getElementById('content').innerHTML = `
    <section class="hero">
      <div class="hero-number">${data.composite_score > 0 ? '+' : ''}${data.composite_score}</div>
      <div>
        <div class="hero-label">${data.interpretation}</div>
        <p class="hero-sub">Échelle -100 à +100. Entrée envisageable au-dessus de +15, prudence en dessous de -15.</p>
      </div>
    </section>
    <div class="divider"></div>

    <h2>Alertes</h2>
    ${alertsHtml || '<p class="hero-sub">Aucune alerte.</p>'}

    <button class="detail-btn" id="toggleDetail" type="button" aria-expanded="false">
      Détail du calcul du rating <span class="chevron">▾</span>
    </button>
    <div class="detail-wrap" id="factorsWrap" hidden>
      ${factorsHtml}
    </div>

    <div class="panel">
      <h2>Repère technique</h2>
      <div class="tech-row"><span class="tech-label">Cours spot</span><span class="tech-value">${spotStr}</span></div>
      <div class="tech-row"><span class="tech-label">Moyenne mobile 200j</span><span class="tech-value">${ma200Str}</span></div>
      <p class="hero-sub" style="margin-top:8px;">${t.note || ''}</p>
    </div>

    <div class="panel">
      <h2>Calendrier macro</h2>
      ${calendarHtml || '<p class="hero-sub">Aucun événement à venir.</p>'}
    </div>
  `;

  document.getElementById('toggleDetail').addEventListener('click', (e) => {
    const btn = e.currentTarget;
    const wrap = document.getElementById('factorsWrap');
    const open = wrap.hidden;
    wrap.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
  });
}

function currentRoute() {
  return location.hash === '#or' ? 'or' : 'home';
}

// #home reste toujours affiché en dessous ; #or glisse par-dessus (et repart)
// pour donner un effet de transition façon navigation mobile.
function showOr(animate) {
  const orEl = document.getElementById('or');
  orEl.hidden = false;
  if (!animate) {
    orEl.classList.add('no-anim');
    orEl.classList.add('screen-in');
    requestAnimationFrame(() => orEl.classList.remove('no-anim'));
  } else {
    requestAnimationFrame(() => orEl.classList.add('screen-in'));
  }
  if (!scoreLoaded) {
    scoreLoaded = true;
    loadScore();
  }
}

function showHome(animate) {
  const orEl = document.getElementById('or');
  if (!animate) {
    orEl.classList.remove('screen-in');
    orEl.hidden = true;
    return;
  }
  orEl.classList.remove('screen-in');
  const onEnd = (e) => {
    if (e.propertyName !== 'transform') return;
    orEl.hidden = true;
    orEl.removeEventListener('transitionend', onEnd);
  };
  orEl.addEventListener('transitionend', onEnd);
}

function renderRoute(animate) {
  const route = currentRoute();
  document.querySelectorAll('.tab[data-route]').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.route === route);
  });
  if (route === 'or') showOr(animate);
  else showHome(animate);
}

document.querySelectorAll('.tab[data-route]').forEach(tab => {
  tab.addEventListener('click', () => { location.hash = '#' + tab.dataset.route; });
});
window.addEventListener('hashchange', () => renderRoute(true));
renderRoute(false);
</script>
</body>
</html>
