<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette - barre de recherche IA</title>
<style>
  :root {
    --bg: #111418;
    --text: #e8ecf2;
    --muted: #7a8494;
    --blue: #3aa0ff;
    --blue-soft: rgba(58, 160, 255, 0.35);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, sans-serif;
  }
  .home {
    min-height: 100%; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 24px; gap: 28px;
    transition: gap 0.6s var(--ease);
  }
  .wordmark { font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
  .search {
    width: 100%; max-width: 920px; position: relative;
  }
  .search input {
    width: 100%; height: 72px; border-radius: 36px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: var(--text); font-size: 20px; padding: 0 28px;
    outline: none;
    transition: border-color 0.4s var(--ease), box-shadow 0.4s var(--ease), background 0.4s var(--ease);
  }
  .search input:focus {
    border-color: var(--blue-soft);
    box-shadow: 0 0 0 6px rgba(58,160,255,0.08), 0 0 60px rgba(58,160,255,0.15);
    background: rgba(255,255,255,0.06);
  }
  .search input::placeholder { color: var(--muted); }

  /* Orbe de réflexion */
  .orb-wrap {
    height: 0; width: 100%; max-width: 920px;
    display: flex; justify-content: center; align-items: center;
    overflow: visible;
    transition: height 0.7s var(--ease);
  }
  .thinking .orb-wrap { height: 200px; }
  .orb {
    position: relative; width: 120px; height: 120px; border-radius: 50%;
    transform: scale(0.2); opacity: 0;
    transition: transform 0.7s var(--ease), opacity 0.5s var(--ease);
  }
  .thinking .orb { transform: scale(1); opacity: 1; }
  .orb-core {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #cfe9ff 0%, var(--blue) 45%, #0a4f99 100%);
    box-shadow: 0 0 60px var(--blue-soft), inset 0 0 30px rgba(255,255,255,0.25);
    animation: breathe 2.6s ease-in-out infinite, morph 7s ease-in-out infinite;
  }
  .orb-ring {
    position: absolute; inset: -18px; border-radius: 50%;
    border: 1px solid rgba(58,160,255,0.35);
    animation: spin 6s linear infinite;
  }
  .orb-ring::after {
    content: ""; position: absolute; top: -4px; left: 50%; width: 8px; height: 8px;
    margin-left: -4px; border-radius: 50%; background: var(--blue);
    box-shadow: 0 0 14px var(--blue);
  }
  .orb-ring.second { inset: -36px; animation-duration: 10s; animation-direction: reverse; opacity: 0.6; }
  @keyframes breathe {
    0%, 100% { filter: brightness(1); transform: scale(1); }
    50% { filter: brightness(1.25); transform: scale(1.06); }
  }
  @keyframes morph {
    0%, 100% { border-radius: 50% 50% 48% 52% / 52% 46% 54% 48%; }
    33% { border-radius: 46% 54% 52% 48% / 48% 56% 44% 52%; }
    66% { border-radius: 54% 46% 44% 56% / 56% 44% 50% 50%; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Réponse */
  .answer {
    width: 100%; max-width: 920px; min-height: 0;
    opacity: 0; transform: translateY(12px);
    transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
  }
  .answer.shown { opacity: 1; transform: translateY(0); }
  .answer p {
    font-size: 17px; line-height: 1.7; color: #d6dde8; margin: 0 0 16px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    padding: 10px 16px; border-radius: 20px; font-size: 14px;
    background: rgba(58,160,255,0.1); border: 1px solid rgba(58,160,255,0.3);
    color: var(--blue); cursor: pointer;
    transition: transform 0.3s var(--ease), background 0.3s var(--ease);
  }
  .chip:hover { transform: translateY(-2px); background: rgba(58,160,255,0.18); }

  .demo {
    margin-top: 8px; font-size: 13px; color: var(--muted);
    background: none; border: 1px dashed rgba(255,255,255,0.15); border-radius: 10px;
    padding: 8px 14px; cursor: pointer;
  }
</style>
</head>
<body>
<div class="home" id="home">
  <div class="wordmark">AI Investment</div>

  <div class="search">
    <input id="q" type="search" placeholder="Demande-moi n'importe quoi sur tes données…">
  </div>

  <div class="orb-wrap">
    <div class="orb" id="orb">
      <div class="orb-core"></div>
      <div class="orb-ring"></div>
      <div class="orb-ring second"></div>
    </div>
  </div>

  <div class="answer" id="answer">
    <p id="answer-text"></p>
    <div class="chips" id="chips"></div>
  </div>

  <button class="demo" id="demo">Simuler une réponse</button>
</div>

<script>
  const home = document.getElementById('home');
  const answer = document.getElementById('answer');
  const answerText = document.getElementById('answer-text');
  const chips = document.getElementById('chips');

  function simulate() {
    answer.classList.remove('shown');
    home.classList.add('thinking');
    answerText.textContent = '';
    chips.innerHTML = '';
    setTimeout(() => {
      home.classList.remove('thinking');
      answerText.textContent = "Safran devance Airbus de 5,5 points de score brut. L'écart vient surtout de la rentabilité : le ROCE de Safran est de 55 % contre 24 % pour Airbus.";
      ['Voir Safran', 'Voir Airbus'].forEach(label => {
        const b = document.createElement('button');
        b.className = 'chip'; b.textContent = label; chips.appendChild(b);
      });
      answer.classList.add('shown');
    }, 2600);
  }

  document.getElementById('demo').addEventListener('click', simulate);
  document.getElementById('q').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.value.trim()) simulate();
  });
</script>
</body>
</html>
