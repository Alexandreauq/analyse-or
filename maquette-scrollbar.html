<title>Barre de défilement de la réponse</title>
<style>
  /* Valeurs reprises du site : fond #0a0e1a/#0f1524, texte #e8ecf5, gris #9aa6c4 */
  :root {
    color-scheme: dark;
    --bg-1: #0f1524; --bg-2: #161d30;
    --text: #e8ecf5; --muted: #9aa6c4; --accent: #d4af37;
    --radius-lg: 16px; --radius-pill: 999px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --speed: 12ms;
  }
  body { margin: 0; min-height: 100%; background: var(--bg-1); color: var(--text); font-family: Inter, system-ui, sans-serif; }
  .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 40px 16px; box-sizing: border-box; }
  .bubble {
    width: min(720px, 100%); box-sizing: border-box;
    background: var(--bg-2); border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius-lg); padding: 22px 26px;
  }
  .text {
    max-height: 50vh; overflow-y: auto;
    font-size: 16px; line-height: 1.7; color: var(--text); white-space: pre-wrap; margin: 0;
    scrollbar-width: thin; scrollbar-color: var(--muted) transparent;
  }
  .text::-webkit-scrollbar { width: 12px; }
  .text::-webkit-scrollbar-track { background: transparent; }
  .text::-webkit-scrollbar-thumb {
    background: var(--muted); border-radius: var(--radius-pill);
    border: 3px solid transparent; background-clip: padding-box;
  }
  .text::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  .caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px; vertical-align: -0.15em; background: var(--accent); animation: blink 1s steps(1) infinite; }
  .caret.off { display: none; }
  @keyframes blink { 50% { opacity: 0; } }
  .controls { display: flex; gap: 10px; }
  .controls button {
    font-size: 13px; color: var(--muted); background: none; border: 1px dashed rgba(255,255,255,0.15);
    border-radius: 10px; padding: 8px 14px; cursor: pointer;
  }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
</style>

<div class="page">
  <div class="bubble">
    <p class="text" id="text"><span id="shown"></span><span class="caret" id="caret"></span></p>
  </div>
  <div class="controls">
    <button id="court">Réponse courte</button>
    <button id="long">Réponse longue (barre visible)</button>
  </div>
</div>

<script>
  const COURT = [
    "Safran devance Airbus de 5,5 points de score brut. ",
    "L'écart vient surtout de la rentabilité : le ROCE de Safran est de 55 % contre 24 % pour Airbus."
  ];
  const LONG = [
    "Safran devance Airbus de 5,5 points de score brut. ",
    "L'écart vient surtout de la rentabilité : le ROCE de Safran est de 55 % contre 24 % pour Airbus.\n\n",
    "Sur la solidité financière, Safran a une trésorerie nette légèrement positive, alors que la dette nette d'Airbus reste faible mais positive. ",
    "La couverture des intérêts est nettement meilleure chez Safran, avec un ICR de 77,1x contre 9,2x pour Airbus.\n\n",
    "Sur la croissance, Airbus progresse un peu plus vite sur son chiffre d'affaires prévisionnel, mais Safran convertit mieux son résultat en trésorerie disponible. ",
    "Le score de croissance est donc plus proche qu'il n'y paraît.\n\n",
    "Sur la valorisation, Safran se paie plus cher que son historique, alors qu'Airbus est au contraire un peu moins cher que sa moyenne sur cinq ans. ",
    "Cet écart pèse sur la note de Safran sans changer le classement global.\n\n",
    "En résumé, Safran gagne sur la rentabilité et la solidité financière. Airbus reste compétitif sur la croissance récente. ",
    "Le score fondamental ne dit pas tout : il faut aussi regarder le prix d'entrée et les signaux actifs avant toute décision."
  ];
  const SPEED = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--speed')) || 12;

  const shown = document.getElementById('shown');
  const caret = document.getElementById('caret');
  const text = document.getElementById('text');
  let target = '', pos = 0, timer = null;

  function step() {
    if (pos < target.length) {
      const behind = target.length - pos;
      const n = behind > 160 ? 5 : behind > 50 ? 2 : 1;
      pos = Math.min(target.length, pos + n);
      shown.textContent = target.slice(0, pos);
      text.scrollTop = text.scrollHeight;
      timer = setTimeout(step, SPEED);
    } else {
      timer = null;
      caret.classList.add('off');
    }
  }

  function play(chunks) {
    clearTimeout(timer); timer = null;
    target = ''; pos = 0; shown.textContent = '';
    caret.classList.remove('off');
    let i = 0;
    const feed = () => {
      if (i < chunks.length) {
        target += chunks[i++];
        if (!timer) step();
        setTimeout(feed, 300 + Math.random() * 250);
      }
    };
    feed();
  }

  document.getElementById('court').addEventListener('click', () => play(COURT));
  document.getElementById('long').addEventListener('click', () => play(LONG));
  play(LONG);
</script>
